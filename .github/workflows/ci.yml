name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated GraphQL types are up to date
        run: npm run codegen && git diff --exit-code src/app/core/graphql/generated
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
