<div class="bar">
  <a class="brand" routerLink="/">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="6" y="18" width="2.4" height="8" rx="1" />
      <rect x="11" y="13" width="2.4" height="13" rx="1" />
      <rect x="16" y="8" width="2.4" height="18" rx="1" />
      <rect x="21" y="11" width="2.4" height="15" rx="1" />
      <rect class="fail" x="26" y="20" width="2.4" height="6" rx="1" />
    </svg>
    <span>Archivo SpaceX</span>
  </a>

  <nav class="nav" aria-label="Principal">
    <ul>
      @for (item of nav; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="is-active"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            >{{ item.label }}</a
          >
        </li>
      }
    </ul>
  </nav>

  <div class="tools">
    <button type="button" class="search" (click)="searchRequested.emit()">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <circle cx="8.5" cy="8.5" r="5.5" />
        <path d="m13 13 4 4" />
      </svg>
      <span class="search-label">Buscar</span>
      <kbd aria-hidden="true">Ctrl K</kbd>
    </button>

    <button
      type="button"
      class="tool"
      (click)="toggleUnits()"
      [attr.aria-label]="
        units() === 'metric' ? 'Cambiar a unidades imperiales' : 'Cambiar a unidades métricas'
      "
    >
      <span [class.on]="units() === 'metric'">m</span>
      <span aria-hidden="true">/</span>
      <span [class.on]="units() === 'imperial'">ft</span>
    </button>

    <button
      type="button"
      class="tool"
      (click)="cycleTheme()"
      [attr.aria-label]="themeLabel() + '. Cambiar a ' + nextThemeLabel()"
      [title]="themeLabel()"
    >
      @switch (theme()) {
        @case ('dark') {
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M15 12.5A6 6 0 0 1 7.5 5a6 6 0 1 0 7.5 7.5Z" />
          </svg>
        }
        @case ('light') {
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="10" r="3.5" />
            <path
              d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4"
            />
          </svg>
        }
        @default {
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <rect x="3" y="4" width="14" height="10" rx="1.5" />
            <path d="M7 17h6" />
          </svg>
        }
      }
    </button>
  </div>
</div>
